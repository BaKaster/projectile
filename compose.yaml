services:
  db:
    image: postgres:17-alpine
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set in .env}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build: .
    env_file:
      - .env
    environment:
      PROJECTILE_DATABASE_URL: ${PROJECTILE_DATABASE_URL:?PROJECTILE_DATABASE_URL must be set in .env}
      PROJECTILE_STORAGE_ROOT: /app/storage
      PROJECTILE_PROJECT_TYPES_PATH: /app/data/project-types.json
      PROJECTILE_PROJECT_STAGE_TEMPLATES_PATH: /app/data/project-stage-templates.json
      PROJECTILE_PROJECT_WORK_TEMPLATES_PATH: /app/data/project-work-templates.json
      PROJECTILE_ROLE_EFFORT_CATALOG_PATH: /app/data/role-effort-catalog.json
      PROJECTILE_EXCEL_ESTIMATE_TEMPLATE_PATH: /app/data/estimate-template.xlsx
      PROJECTILE_EXCEL_RECALCULATION_COMMAND: /usr/bin/libreoffice
      PROJECTILE_AUTO_CREATE_SCHEMA: "true"
      PROJECTILE_MAX_UPLOAD_SIZE_BYTES: ${PROJECTILE_MAX_UPLOAD_SIZE_BYTES:-536870912}
      PROJECTILE_MAX_FILES_PER_REQUEST: ${PROJECTILE_MAX_FILES_PER_REQUEST:-1000}
      PROJECTILE_CORS_ORIGINS: ${PROJECTILE_CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
      KEY_OPENAI: ${KEY_OPENAI:-}
      PROJECTILE_ANALYSIS_MODEL: ${PROJECTILE_ANALYSIS_MODEL:-gpt-5.5}
      PROJECTILE_ANALYSIS_REASONING_EFFORT: ${PROJECTILE_ANALYSIS_REASONING_EFFORT:-high}
      PROJECTILE_ANALYSIS_AI_EFFORT_REFINEMENT: ${PROJECTILE_ANALYSIS_AI_EFFORT_REFINEMENT:-true}
      PROJECTILE_ANALYSIS_DIGEST_CONCURRENCY: ${PROJECTILE_ANALYSIS_DIGEST_CONCURRENCY:-2}
      PROJECTILE_RECOGNITION_MODEL: ${PROJECTILE_RECOGNITION_MODEL:-small}
      PROJECTILE_RECOGNITION_DEVICE: ${PROJECTILE_RECOGNITION_DEVICE:-cpu}
      PROJECTILE_RECOGNITION_COMPUTE_TYPE: ${PROJECTILE_RECOGNITION_COMPUTE_TYPE:-int8}
    ports:
      - "8000:8000"
    volumes:
      - ./storage:/app/storage
      - model_cache:/home/appuser/.cache
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  model_cache:
