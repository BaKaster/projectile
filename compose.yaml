services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-projectile}
      POSTGRES_USER: ${POSTGRES_USER:-projectile}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-projectile}
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build: .
    environment:
      PROJECTILE_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-projectile}:${POSTGRES_PASSWORD:-projectile}@db:5432/${POSTGRES_DB:-projectile}
      PROJECTILE_STORAGE_ROOT: /app/storage
      PROJECTILE_PROJECT_TYPES_PATH: /app/data/project-types.json
      PROJECTILE_AUTO_CREATE_SCHEMA: "true"
      PROJECTILE_MAX_UPLOAD_SIZE_BYTES: ${PROJECTILE_MAX_UPLOAD_SIZE_BYTES:-536870912}
      PROJECTILE_MAX_FILES_PER_REQUEST: ${PROJECTILE_MAX_FILES_PER_REQUEST:-100}
      PROJECTILE_CORS_ORIGINS: ${PROJECTILE_CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
    ports:
      - "8000:8000"
    volumes:
      - ./storage:/app/storage
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
